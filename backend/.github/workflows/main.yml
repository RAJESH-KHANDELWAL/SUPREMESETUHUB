name: Main Foundation Backend Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-boot-test:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # CHECKOUT
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # VERIFY BACKEND STRUCTURE
      # ----------------------------------------

      - name: Verify backend structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SUPREMESETUHUB BACKEND CI"
          echo "========================================"

          echo ""
          echo "Repository root:"
          pwd

          echo ""
          echo "Backend directory:"
          ls -la backend

          echo ""
          echo "Checking backend requirements:"
          test -f backend/requirements.txt

          echo "backend/requirements.txt: FOUND"

          echo ""
          echo "Checking backend application:"
          test -d backend/app
          test -f backend/app/main.py

          echo "backend/app/main.py: FOUND"

          echo ""
          echo "Checking backend tests:"
          test -d backend/tests

          echo "backend/tests: FOUND"

      # ----------------------------------------
      # PYTHON
      # ----------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ----------------------------------------
      # DEPENDENCIES
      # ----------------------------------------

      - name: Install backend dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      # ----------------------------------------
      # COMPILE BACKEND
      # ----------------------------------------

      - name: Compile backend
        shell: bash
        run: |
          set -e

          python -m compileall backend

          echo ""
          echo "BACKEND COMPILE: PASS"

      # ----------------------------------------
      # BACKEND TESTS ONLY
      # ----------------------------------------

      - name: Run backend tests
        shell: bash
        run: |
          set -e

          python -m pytest backend/tests -v

      # ----------------------------------------
      # BACKEND TEST RESULT
      # ----------------------------------------

      - name: Backend CI Success
        if: success()
        run: |
          echo "========================================"
          echo "MAIN BASE FOUNDATION BACKEND CI: PASS"
          echo "========================================"

      - name: Backend CI Failed
        if: failure()
        run: |
          echo "========================================"
          echo "MAIN BASE FOUNDATION BACKEND CI: FAILED"
          echo "========================================"
          exit 1

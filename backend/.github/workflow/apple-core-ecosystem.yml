name: Apple Core Ecosystem Tests

on:
  push:
    paths:
      - "backend/test/test_apple_core_ecosystem.py"
      - "backend/test/test_apple_core_ecosystem.php"
      - "backend/core/global_ecosystem/global_core_ecosystem/apple_core_ecosystem/**"
      - ".github/workflows/apple-core-ecosystem.yml"
  pull_request:
    paths:
      - "backend/test/test_apple_core_ecosystem.py"
      - "backend/test/test_apple_core_ecosystem.php"
      - "backend/core/global_ecosystem/global_core_ecosystem/apple_core_ecosystem/**"
      - ".github/workflows/apple-core-ecosystem.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-core-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Apple Python test
        env:
          PYTHONPATH: .
        run: python -m pytest backend/test/test_apple_core_ecosystem.py -q

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Run Apple PHP test
        run: php backend/test/test_apple_core_ecosystem.php

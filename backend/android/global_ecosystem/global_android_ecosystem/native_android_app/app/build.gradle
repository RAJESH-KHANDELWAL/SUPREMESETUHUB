plugins {
    id 'com.android.application'
}

def configuredApiBaseUrl = providers.gradleProperty("SUPREME_API_BASE_URL")
    .orElse(providers.environmentVariable("SUPREME_API_BASE_URL"))
    .getOrElse("")

if (!configuredApiBaseUrl.isEmpty() && !configuredApiBaseUrl.startsWith("https://")) {
    throw new GradleException("SUPREME_API_BASE_URL must use HTTPS.")
}

android {
    namespace 'com.mainbasefoundation.android'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.mainbasefoundation.android'
        minSdk 26
        targetSdk 36

        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "API_BASE_URL", "${groovy.json.JsonOutput.toJson(configuredApiBaseUrl)}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THEME HUB</title>

    <link rel="stylesheet" href="/api/v1/theme-hub/frontend/style.css">
</head>

<body>

    <header class="HOME-THEME-HUB-HEADER">

        <div class="HOME-THEME-HUB-BRAND">
            👑 THEME HUB
        </div>

        <div class="HOME-THEME-HUB-SUBTITLE">
            🌍 GLOBAL WORDPRESS THEME DISCOVERY
        </div>

    </header>


    <main class="HOME-THEME-HUB-MAIN">

        <section class="HOME-THEME-HUB-SEARCH-SECTION">

            <h1 class="HOME-THEME-HUB-TITLE">
                🔍 FIND YOUR WORDPRESS THEME
            </h1>

            <p class="HOME-THEME-HUB-DESCRIPTION">
                SEARCH AND DISCOVER WORDPRESS THEMES DIRECTLY FROM THE WORDPRESS.ORG THEME DIRECTORY
            </p>

            <div class="HOME-THEME-HUB-SEARCH-BOX">

                <input
                    type="search"
                    id="HOME-THEME-HUB-SEARCH-INPUT"
                    class="HOME-THEME-HUB-SEARCH-INPUT"
                    placeholder="Search themes... e.g. Astra"
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="HOME-THEME-HUB-SEARCH-BUTTON"
                    class="HOME-THEME-HUB-SEARCH-BUTTON"
                >
                    🔍 SEARCH
                </button>

            </div>

        </section>


        <section class="HOME-THEME-HUB-STATUS-SECTION">

            <div
                id="HOME-THEME-HUB-STATUS"
                class="HOME-THEME-HUB-STATUS"
            >
                ⏳ LOADING THEMES...
            </div>

        </section>


        <section
            id="HOME-THEME-HUB-THEMES"
            class="HOME-THEME-HUB-THEMES"
        >

        </section>

    </main>


    <footer class="HOME-THEME-HUB-FOOTER">

        👑 DR RAJESH KHANDELWAL IBC 👑

        <br>

        🌍 GLOBAL BUSINESS COACH | 🧠 INDEPENDENT BUSINESS CONSULTANT

    </footer>


    <script src="/api/v1/theme-hub/frontend/script.js"></script>

</body>
</html>

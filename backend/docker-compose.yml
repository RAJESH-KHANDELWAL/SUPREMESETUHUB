services:
  supreme-foundation:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    container_name: supreme-foundation
    restart: unless-stopped

    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

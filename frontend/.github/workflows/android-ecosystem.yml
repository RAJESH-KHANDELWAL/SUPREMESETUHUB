name: Frontend Android Ecosystem Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/android/**"
      - "backend/test/test_frontend_global_android_ecosystem.py"
      - "backend/test/test_frontend_global_android_ecosystem.php"
      - "frontend/.github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/android/**"
      - "backend/test/test_frontend_global_android_ecosystem.py"
      - "backend/test/test_frontend_global_android_ecosystem.php"
      - "frontend/.github/workflows/**"

permissions:
  contents: read

jobs:
  frontend-android-tests:
    name: Frontend Android Validation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run Frontend Android Python Test
        run: python -m pytest -v backend/test/test_frontend_global_android_ecosystem.py
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Validate and Run Frontend Android PHP Test
        run: |
          php -l backend/test/test_frontend_global_android_ecosystem.php
          php backend/test/test_frontend_global_android_ecosystem.php

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPREME ECOSYSTEM — SIGN IN</title>
<link rel="stylesheet" href="bydefault.css">
<link rel="stylesheet" href="signin.css">
</head>
<body>
<main>
<div class="brand">SUPREME ECOSYSTEM</div>
<h1>OWNER SIGN IN</h1>
<p>Private owner-only control area. This system does not provide public signup or customer accounts.</p>
<form id="signInForm">
<label for="username">OWNER USERNAME</label>
<input id="username" name="username" autocomplete="username" required>
<label for="password">PASSWORD</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submitButton" type="submit">SIGN IN TO SUPREME ECOSYSTEM</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<a class="back" href="index.html">← BACK TO MAIN BASE FOUNDATION</a>
</main>
<script src="bydefault.js" defer></script>
<script src="signin.js" defer></script>
</body>
</html>

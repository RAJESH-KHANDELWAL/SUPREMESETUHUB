<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>👑 DR RAJESH KHANDELWAL IBC 👑 — SUPREME DASHBOARD</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                'Century Schoolbook',
                'Libre Baskerville',
                serif !important;

            font-weight: 800 !important;

            background: #f4f7fb;
            color: #111827;
        }

        .topbar {
            background: #111827;
            color: #ffffff;
            padding: 28px 20px;
            text-align: center;
        }

        .brand {
            font-family:
                'Century Schoolbook',
                'Libre Baskerville',
                serif !important;

            font-weight: 800 !important;

            font-size: 30px;
            line-height: 1.4;
        }

        .dashboard-title {
            margin-top: 10px;
            font-size: 22px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
        }

        .section-title {
            font-family:
                'Century Schoolbook',
                'Libre Baskerville',
                serif !important;

            font-weight: 800 !important;

            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow:
                0 4px 16px
                rgba(0, 0, 0, 0.06);
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .active {
            color: #15803d;
            font-weight: 800;
        }

        .identity-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;
        }

        .identity {
            background: #ffffff;
            padding: 24px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow:
                0 4px 16px
                rgba(0, 0, 0, 0.06);
        }

        .identity h3 {
            font-family:
                'Century Schoolbook',
                'Libre Baskerville',
                serif !important;

            font-weight: 800 !important;

            margin-bottom: 16px;
        }

        .identity p {
            margin: 10px 0;
            word-break: break-word;
        }

        .identity a {
            color: #2563eb;
            text-decoration: none;
        }

        .loading {
            padding: 20px;
            text-align: center;
        }

        .error {
            color: #dc2626;
            font-weight: 800;
        }

        footer {
            font-family:
                'Century Schoolbook',
                'Libre Baskerville',
                serif !important;

            font-weight: 800 !important;

            text-align: center;
            padding: 35px;
            color: #6b7280;
        }

    </style>
</head>


<body>


<header class="topbar">

    <div class="brand">
        👑 DR RAJESH KHANDELWAL IBC 👑
    </div>

    <div class="dashboard-title">
        👑 SUPREME DASHBOARD 👑
    </div>

</header>


<main class="container">


    <h2 class="section-title">
        SUPREME SYSTEM STATUS
    </h2>


    <section
        id="system-status"
        class="cards"
    >

        <div class="loading">
            Connecting to SUPREMESETUHUB...
        </div>

    </section>


    <h2 class="section-title">
        👑 SUPREME IDENTITIES 👑
    </h2>


    <section
        id="identities"
        class="identity-grid"
    >

        <div class="loading">
            Loading identities...
        </div>

    </section>


</main>


<footer>

    👑 DR RAJESH KHANDELWAL IBC 👑

    <br><br>

    SUPREMESETUHUB

</footer>


<script>

const API =
    "https://supremesetuhub-3v4e.onrender.com";


async function loadDashboard() {

    const statusBox =
        document.getElementById(
            "system-status"
        );

    const identityBox =
        document.getElementById(
            "identities"
        );


    try {

        const statusResponse =
            await fetch(
                API + "/supreme/status"
            );


        if (!statusResponse.ok) {

            throw new Error(
                "Backend status request failed"
            );

        }


        const status =
            await statusResponse.json();


        statusBox.innerHTML = `

            <div class="card">
                <h3>API</h3>
                <p class="active">
                    ${status.api}
                </p>
            </div>


            <div class="card">
                <h3>PEOPLE DASHBOARD</h3>
                <p class="active">
                    ${status.people_dashboard}
                </p>
            </div>


            <div class="card">
                <h3>SUPREME DASHBOARD</h3>
                <p class="active">
                    ${status.supreme_dashboard}
                </p>
            </div>


            <div class="card">
                <h3>WORDPRESS</h3>
                <p class="active">
                    ${status.wordpress}
                </p>
            </div>


            <div class="card">
                <h3>BACKEND</h3>
                <p class="active">
                    ${status.backend}
                </p>
            </div>


            <div class="card">
                <h3>SYSTEM</h3>
                <p class="active">
                    ${status.status}
                </p>
            </div>

        `;


        const identityResponse =
            await fetch(
                API + "/supreme/identities"
            );


        if (!identityResponse.ok) {

            throw new Error(
                "Identity request failed"
            );

        }


        const identityData =
            await identityResponse.json();


        identityBox.innerHTML = "";


        identityData.identities.forEach(
            identity => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "identity";


                card.innerHTML = `

                    <h3>
                        ${identity.display_name}
                    </h3>


                    <p>
                        <strong>
                            USERNAME
                        </strong>

                        <br>

                        ${identity.username}
                    </p>


                    <p>
                        <strong>
                            DOMAIN
                        </strong>

                        <br>

                        <a
                            href="${identity.domain}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${identity.domain}
                        </a>
                    </p>

                `;


                identityBox.appendChild(card);

            }
        );


    } catch (error) {

        statusBox.innerHTML = `

            <div class="card error">

                SUPREMESETUHUB
                BACKEND CONNECTION FAILED

            </div>

        `;


        identityBox.innerHTML = `

            <div class="error">

                SUPREME IDENTITIES
                COULD NOT BE LOADED.

            </div>

        `;


        console.error(error);

    }

}


loadDashboard();

</script>


</body>
</html>

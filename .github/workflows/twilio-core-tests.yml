name: Twilio Core Ecosystem Tests

on:
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/twilio_core_ecosystem/**"
      - ".github/workflows/twilio-core-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/twilio_core_ecosystem/**"
      - ".github/workflows/twilio-core-tests.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Twilio Core tests
        run: python -m unittest discover -s backend/core/global_ecosystem/global_core_ecosystem/twilio_core_ecosystem/tests -p "test_*.py" -v
      - name: Compile Twilio Core
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/twilio_core_ecosystem

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP facade syntax
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/twilio_core_ecosystem/manager.php

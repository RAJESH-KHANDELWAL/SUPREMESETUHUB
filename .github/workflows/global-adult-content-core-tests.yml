name: Global Adult Content CORE Integrity

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_adult_content_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/catalog.py"
      - ".github/workflows/global-adult-content-core-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_adult_content_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/catalog.py"
      - ".github/workflows/global-adult-content-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adult-content-core-integrity:
    name: Adult Content CORE taxonomy and policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        run: |
          python -m json.tool backend/core/global_ecosystem/global_core_ecosystem/global_adult_content_core_ecosystem/ecosystem_manifest.json >/dev/null
          python -m json.tool backend/core/global_ecosystem/global_core_ecosystem/global_adult_content_core_ecosystem/taxonomy_catalog.json >/dev/null
      - name: Run focused Python integrity tests
        env:
          PYTHONPATH: .
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_adult_content_core_ecosystem.tests.test_global_adult_content_core -v
      - name: Validate PHP contract syntax
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l backend/core/global_ecosystem/global_core_ecosystem/global_adult_content_core_ecosystem/php/AdultContentTaxonomyContract.php
          else
            echo "PHP CLI unavailable in this runner; repository-wide PHP syntax workflow remains the secondary check."
          fi

name: Apple Core Ecosystem Tests
on:
  push:
    branches: [main]
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/apple_core_ecosystem/**'
      - '.github/workflows/apple-core-ecosystem-tests.yml'
  pull_request:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/apple_core_ecosystem/**'
      - '.github/workflows/apple-core-ecosystem-tests.yml'
jobs:
  apple-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Apple Core manager tests
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.apple_core_ecosystem.tests.test_apple_core_manager -v

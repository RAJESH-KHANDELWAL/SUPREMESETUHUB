name: OPENAI CORE ECOSYSTEM TESTS

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/openai-core-ecosystem-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/openai-core-ecosystem-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-core:
    name: OpenAI Core catalog, packages, hierarchy and PHP contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0,<9.0"
      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem
          python -m py_compile backend/core/global_ecosystem/global_core_ecosystem/manager.py
      - name: Run OpenAI Core tests
        env:
          PYTHONPATH: .
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem/test_openai_core.py -q
      - name: Check PHP facade and contracts
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem/manager.php
            php -l backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem/openai_php_core_ecosystem/OpenAICoreContract.php
            php -l backend/core/global_ecosystem/global_core_ecosystem/openai_core_ecosystem/openai_php_core_ecosystem/OpenAICoreDomainContract.php
          else
            echo "PHP CLI unavailable; skipped"
          fi

name: SERVER Foundation Tests
on:
  push:
    branches: [main]
    paths:
      - "backend/server/**"
      - ".github/workflows/test-server-foundation.yml"
  pull_request:
    paths:
      - "backend/server/**"
      - ".github/workflows/test-server-foundation.yml"
jobs:
  server-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SERVER foundation tests
        run: python -m unittest backend.server.test_server_domain backend.server.global_ecosystem.global_server_ecosystem.test_server backend.server.global_ecosystem.global_server_ecosystem.test_registry backend.server.global_ecosystem.global_server_ecosystem.test_runtime backend.server.global_ecosystem.global_server_ecosystem.test_operations backend.server.global_ecosystem.global_server_ecosystem.test_provider_ecosystems

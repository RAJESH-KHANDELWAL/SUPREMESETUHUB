name: Python Core Database Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/infrastructure/ftp/**"
      - "backend/gallary_woult/**"
      - "backend/api/gallary_woult.py"
      - "backend/api/dashboard.py"
      - "backend/api/people.py"
      - "backend/api/payee_verification.py"
      - "backend/core/payments/**"
      - "backend/wordpress/**"
      - "backend/api/wordpress.py"
      - "backend/engine/storage/**"
      - "backend/engine/database/**"
      - "backend/api/service.py"
      - "backend/api/app.py"
      - "backend/api/print_on_demand.py"
      - "backend/print_on_demand/**"
      - "backend/api/auth.py"
      - "backend/api/businesses.py"
      - "backend/businesses/**"
      - "backend/bada_business/**"
      - "backend/api/supreme_ecosystem.py"
      - "backend/api/supreme_whatsapp_ai.py"
      - "backend/core/**"
      - "backend/supreme/**"
      - "backend/organizations/**"
      - "backend/auth/**"
      - "backend/users/**"
      - "backend/identity/**"
      - "backend/security.py"
      - "backend/infrastructure/storage/**"
      - "backend/infrastructure/security/**"
      - "backend/infrastructure/backup/**"
      - "backend/storage/**"
      - "backend/security/**"
      - "backend/test/**"
      - ".github/workflows/python-core-database.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/infrastructure/ftp/**"
      - "backend/gallary_woult/**"
      - "backend/api/gallary_woult.py"
      - "backend/api/dashboard.py"
      - "backend/api/people.py"
      - "backend/wordpress/**"
      - "backend/api/wordpress.py"
      - "backend/engine/database/**"
      - "backend/api/service.py"
      - "backend/api/app.py"
      - "backend/api/print_on_demand.py"
      - "backend/print_on_demand/**"
      - "backend/api/auth.py"
      - "backend/api/businesses.py"
      - "backend/businesses/**"
      - "backend/api/supreme_ecosystem.py"
      - "backend/api/supreme_whatsapp_ai.py"
      - "backend/core/**"
      - "backend/supreme/**"
      - "backend/organizations/**"
      - "backend/auth/**"
      - "backend/users/**"
      - "backend/identity/**"
      - "backend/security.py"
      - "backend/infrastructure/storage/**"
      - "backend/infrastructure/security/**"
      - "backend/infrastructure/backup/**"
      - "backend/storage/**"
      - "backend/security/**"
      - "backend/test/**"
      - ".github/workflows/python-core-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run GLOBAL CORE Ecosystem Hierarchy Tests
        run: python -m unittest backend.test.test_global_core_ecosystem_hierarchy -v

      - name: Run Anthropic Core catalog and nine product-family tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.tests.test_catalog \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_admin_workspaces_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_auth_identity_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_batches_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_files_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_managed_agents_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_messages_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_models_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_token_counting_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.anthropic_core_ecosystem.anthropic_tool_use_core_ecosystem.tests.test_manifest -v

      - name: Run Apple Core catalog and eight product-family tests
        env:
          PYTHONPATH: .
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.apple_core_ecosystem.tests.test_catalog -v

      - name: Run Atlassian Core catalog and five product-family tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            backend.core.global_ecosystem.global_core_ecosystem.atlassian_core_ecosystem.tests.test_catalog \
            backend.core.global_ecosystem.global_core_ecosystem.atlassian_core_ecosystem.atlassian_admin_identity_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.atlassian_core_ecosystem.atlassian_bitbucket_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.atlassian_core_ecosystem.atlassian_confluence_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.atlassian_core_ecosystem.atlassian_jira_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.atlassian_core_ecosystem.atlassian_jira_service_management_core_ecosystem.tests.test_manifest -v

      - name: Run AWS Core catalog and sixteen service-family tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.tests.test_catalog \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_api_gateway_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_bedrock_sagemaker_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_billing_cost_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_cloudformation_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_cloudtrail_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_cloudwatch_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_containers_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_database_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_ec2_compute_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_iam_sts_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_kms_secrets_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_lambda_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_lightsail_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_route53_dns_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_s3_storage_core_ecosystem.tests.test_manifest \
            backend.core.global_ecosystem.global_core_ecosystem.aws_core_ecosystem.aws_vpc_networking_core_ecosystem.tests.test_manifest -v

      - name: Run GLOBAL ECOSYSTEM registry integration tests
        env:
          PYTHONPATH: .
        run: python -m unittest backend.test.global_core_ecosystem_test -v

      - name: Run GLOBAL AI Ecosystem Layer Tests
        run: python -m unittest backend.test.test_global_ai_ecosystem -v

      - name: Run FTP health-check unit tests
        run: python -m pytest -q backend/test/test_ftp_healthcheck.py

      - name: Run GDE database configuration tests
        run: python -m pytest -q backend/test/test_gde_connection.py

      - name: Run Bada Business Ecosystem Resource Tests
        run: python -m pytest -q backend/test/test_bada_business_ecosystem_resources.py


      - name: Run central database service tests
        run: python -m pytest -q backend/test/test_gallery_woult_storage_safety.py backend/test/test_s3_storage_adapter.py backend/test/test_supreme_control_service.py backend/test/test_database_engine.py backend/test/test_database_service.py backend/test/test_infrastructure_modules.py backend/test/test_private_ecosystem_access.py backend/test/test_supreme_referral_stack.py backend/test/test_authentication_security.py backend/test/test_auth_signout_security.py backend/test/test_signup_route.py backend/test/test_business_id_generation.py backend/test/test_print_on_demand.py backend/test/test_print_on_demand_api.py backend/test/test_auth_signin_route.py backend/test/test_storage_engine.py backend/test/test_wordpress_connection.py backend/test/test_dashboard_metrics.py backend/test/test_people_engine_api.py backend/test/test_payee_verification.py backend/test/test_big_businesses_enterprise.py backend/test/test_gde_connection.py

  security-core-integrity:
    name: Global Security CORE Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Global Security CORE integrity and contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/global_security_core_ecosystem/test

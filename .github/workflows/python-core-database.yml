name: Python Core Database Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/tests/**"
      - ".github/workflows/python-core-database.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/tests/**"
      - ".github/workflows/python-core-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run central database service tests
        run: python -m pytest -q backend/tests/test_database_service.py

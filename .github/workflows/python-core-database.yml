name: Python Core Database Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/gallary_woult/**"
      - "backend/api/gallary_woult.py"
      - "backend/api/dashboard.py"
      - "backend/api/people.py"
      - "backend/api/payee_verification.py"
      - "backend/core/payments/**"
      - "backend/wordpress/**"
      - "backend/api/wordpress.py"
      - "backend/engines/storage/**"
      - "backend/engines/database/**"
      - "backend/api/service.py"
      - "backend/api/app.py"
      - "backend/api/print_on_demand.py"
      - "backend/print_on_demand/**"
      - "backend/api/auth.py"
      - "backend/api/businesses.py"
      - "backend/businesses/**"
      - "backend/api/supreme_ecosystem.py"
      - "backend/api/supreme_whatsapp_ai.py"
      - "backend/core/**"
      - "backend/supreme/**"
      - "backend/organizations/**"
      - "backend/auth/**"
      - "backend/users/**"
      - "backend/identity/**"
      - "backend/security.py"
      - "backend/infrastructure/storage/**"
      - "backend/infrastructure/security/**"
      - "backend/infrastructure/backup/**"
      - "backend/storage/**"
      - "backend/security/**"
      - "backend/tests/**"
      - ".github/workflows/python-core-database.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/gallary_woult/**"
      - "backend/api/gallary_woult.py"
      - "backend/api/dashboard.py"
      - "backend/api/people.py"
      - "backend/wordpress/**"
      - "backend/api/wordpress.py"
      - "backend/engines/database/**"
      - "backend/api/service.py"
      - "backend/api/app.py"
      - "backend/api/print_on_demand.py"
      - "backend/print_on_demand/**"
      - "backend/api/auth.py"
      - "backend/api/businesses.py"
      - "backend/businesses/**"
      - "backend/api/supreme_ecosystem.py"
      - "backend/api/supreme_whatsapp_ai.py"
      - "backend/core/**"
      - "backend/supreme/**"
      - "backend/organizations/**"
      - "backend/auth/**"
      - "backend/users/**"
      - "backend/identity/**"
      - "backend/security.py"
      - "backend/infrastructure/storage/**"
      - "backend/infrastructure/security/**"
      - "backend/infrastructure/backup/**"
      - "backend/storage/**"
      - "backend/security/**"
      - "backend/tests/**"
      - ".github/workflows/python-core-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run central database service tests
        run: python -m pytest -q backend/tests/test_gallery_woult_storage_safety.py backend/tests/test_s3_storage_adapter.py backend/tests/test_supreme_control_service.py backend/tests/test_database_engine.py backend/tests/test_database_service.py backend/tests/test_infrastructure_modules.py backend/tests/test_private_ecosystem_access.py backend/tests/test_supreme_referral_stack.py backend/tests/test_authentication_security.py backend/tests/test_auth_signout_security.py backend/tests/test_signup_route.py backend/tests/test_business_id_generation.py backend/tests/test_print_on_demand.py backend/tests/test_print_on_demand_api.py backend/tests/test_auth_signin_route.py backend/tests/test_storage_engine.py backend/tests/test_wordpress_connection.py backend/tests/test_dashboard_metrics.py backend/tests/test_people_engine_api.py

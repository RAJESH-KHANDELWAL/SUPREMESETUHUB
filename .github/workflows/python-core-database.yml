name: Python Core Database Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/api/service.py"
      - "backend/api/app.py"
      - "backend/api/auth.py"
      - "backend/api/businesses.py"
      - "backend/businesses/**"
      - "backend/api/supreme_ecosystem.py"
      - "backend/api/supreme_whatsapp_ai.py"
      - "backend/core/**"
      - "backend/supreme/**"
      - "backend/organizations/**"
      - "backend/auth/**"
      - "backend/users/**"
      - "backend/identity/**"
      - "backend/security.py"
      - "backend/infrastructure/storage/**"
      - "backend/infrastructure/security/**"
      - "backend/infrastructure/backup/**"
      - "backend/storage/**"
      - "backend/security/**"
      - "backend/tests/**"
      - ".github/workflows/python-core-database.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/api/app.py"
      - "backend/api/auth.py"
      - "backend/api/businesses.py"
      - "backend/businesses/**"
      - "backend/api/supreme_ecosystem.py"
      - "backend/api/supreme_whatsapp_ai.py"
      - "backend/core/**"
      - "backend/supreme/**"
      - "backend/organizations/**"
      - "backend/auth/**"
      - "backend/users/**"
      - "backend/identity/**"
      - "backend/security.py"
      - "backend/security/**"
      - "backend/tests/**"
      - ".github/workflows/python-core-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run central database service tests
        run: python -m pytest -q backend/tests/test_database_service.py backend/tests/test_infrastructure_modules.py backend/tests/test_private_ecosystem_access.py backend/tests/test_supreme_referral_stack.py backend/tests/test_auth_logout_security.py backend/tests/test_business_id_generation.py

name: Global Social Media Core Ecosystem Tests

on:
  push:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-social-media-core-ecosystem-tests.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-social-media-core-ecosystem-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-media-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile Social Media Core Python modules
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem
      - name: Run Social Media Core tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem/test_social_media_core_domains.py -q
      - name: Validate master catalog JSON
        run: python -m json.tool backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json > /dev/null
      - name: Validate platform manifests and index JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem")
          index = json.loads((root / "product_ecosystem_index.json").read_text())
          assert index["platform_count"] == len(index["platform_ecosystems"]) == 113
          for item in index["platform_ecosystems"]:
              path = root / f"{item['platform_id']}_social_media_core_ecosystem" / "ecosystem_manifest.json"
              manifest = json.loads(path.read_text())
              assert manifest["platform_id"] == item["platform_id"]
              assert manifest["domain_id"] == item["domain_id"]
          print("Validated 113 platform manifests.")
          PY
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint PHP interoperability files
        run: |
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem/manager.php
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_social_media_core_ecosystem/php/GlobalSocialMediaCoreContract.php

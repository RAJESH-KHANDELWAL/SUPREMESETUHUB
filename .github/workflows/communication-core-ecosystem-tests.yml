name: Global Communication Core Ecosystem Tests
on:
  pull_request:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/global_communication_core_ecosystem/**'
      - '.github/workflows/communication-core-ecosystem-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/global_communication_core_ecosystem/**'
jobs:
  communication-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile Core package
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_communication_core_ecosystem
      - name: Run focused contract tests
        run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/global_communication_core_ecosystem/tests

name: GLOBAL PEOPLE LIFE CORE TESTS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  people-life-core:
    name: People Life domain managers, routing and policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt "pytest>=8.0,<9.0"

      - name: Test People Life domain packages and module routing
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_people_life_core_ecosystem/test_core_domains.py -q
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_people_life_core_ecosystem/tests/test_core_contracts.py -q

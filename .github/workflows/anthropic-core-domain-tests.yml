name: ANTHROPIC CORE DOMAIN TESTS

on:
  push:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/anthropic_core_ecosystem/**"
      - ".github/workflows/anthropic-core-domain-tests.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/anthropic_core_ecosystem/**"
      - ".github/workflows/anthropic-core-domain-tests.yml"
  workflow_dispatch:

jobs:
  anthropic-core-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run Anthropic Core domain tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/anthropic_core_ecosystem/test_anthropic_core_domains.py -q

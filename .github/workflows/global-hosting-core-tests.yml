name: Global Hosting Core Ecosystem Tests
on:
  push:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/global_hosting_core_ecosystem/**'
      - 'backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json'
      - '.github/workflows/global-hosting-core-tests.yml'
  pull_request:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/global_hosting_core_ecosystem/**'
      - 'backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json'
      - '.github/workflows/global-hosting-core-tests.yml'
  workflow_dispatch:
jobs:
  hosting-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run Hosting Core tests
        run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/global_hosting_core_ecosystem/tests/test_hosting_core.py

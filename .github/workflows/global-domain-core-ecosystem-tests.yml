name: Global Domain Core Ecosystem Tests
on:
  push:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_domain_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_domain_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
jobs:
  domain-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall backend/core/global_ecosystem/global_core_ecosystem/global_domain_core_ecosystem
      - run: python -m pip install pytest
      - run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/global_domain_core_ecosystem/test_global_domain_core.py
      - run: php -l backend/core/global_ecosystem/global_core_ecosystem/global_domain_core_ecosystem/manager.php

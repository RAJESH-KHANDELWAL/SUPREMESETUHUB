name: Global Cloudflare Core Ecosystem Tests

on:
  push:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_cloudflare_core_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-cloudflare-core-ecosystem-tests.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_cloudflare_core_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-cloudflare-core-ecosystem-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_cloudflare_core_ecosystem
      - name: Run Cloudflare Core tests
        run: |
          python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_cloudflare_core_ecosystem.test_cloudflare_core -v
      - name: Validate PHP syntax
        run: |
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_cloudflare_core_ecosystem/manager.php

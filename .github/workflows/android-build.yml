name: Android Structure Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-structure-tests:
    name: Backend and Frontend Android Structure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Android Python Tests
        run: |
          python -m pytest backend/test/test_android.py -v
          python -m pytest backend/test/test_android_global_ecosystem.py -v
          python -m pytest backend/test/test_global_android_ecosystem.py -v

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate Android PHP Tests
        run: |
          php -l backend/test/test_android.php
          php -l backend/test/test_global_android_ecosystem.php

      - name: Run Android PHP Tests
        run: |
          php backend/test/test_android.php
          php backend/test/test_global_android_ecosystem.php

name: Backend Global Android Native App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "backend/android/global_ecosystem/global_android_ecosystem/**"
      - "backend/test/test_android_foundation.py"
      - "backend/requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "backend/android/global_ecosystem/global_android_ecosystem/**"
      - "backend/test/test_android_foundation.py"
      - "backend/requirements.txt"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend and Android Foundation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Run Android Foundation Contract Tests
        run: python -m pytest backend/test/test_android_foundation.py -v

  android-release:
    name: Build Android Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Android SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android Release AAB
        working-directory: backend/android/global_ecosystem/global_android_ecosystem/native_android_app
        run: |
          gradle :app:bundleRelease \
            --stacktrace \
            --no-daemon
      - name: Verify Release AAB
        run: |
          AAB="backend/android/global_ecosystem/global_android_ecosystem/native_android_app/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          ls -lh "$AAB"
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: supreme-setu-hub-android-release-aab
          path: backend/android/global_ecosystem/global_android_ecosystem/native_android_app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

name: Android Ecosystem Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "backend/android/**"
      - "frontend/android/**"
      - "backend/test/test_backend_global_android_ecosystem.py"
      - "backend/test/test_backend_global_android_ecosystem.php"
      - "backend/test/test_frontend_global_android_ecosystem.py"
      - "backend/test/test_frontend_global_android_ecosystem.php"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "backend/android/**"
      - "frontend/android/**"
      - "backend/test/test_backend_global_android_ecosystem.py"
      - "backend/test/test_backend_global_android_ecosystem.php"
      - "backend/test/test_frontend_global_android_ecosystem.py"
      - "backend/test/test_frontend_global_android_ecosystem.php"

permissions:
  contents: read

jobs:
  android-ecosystem-tests:
    name: Validate Backend and Frontend Android Ecosystems
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Test Dependency
        run: python -m pip install --upgrade pytest

      - name: Run Backend and Frontend Android Python Tests
        run: |
          python -m pytest -v             backend/test/test_backend_global_android_ecosystem.py             backend/test/test_frontend_global_android_ecosystem.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP Test Syntax
        run: |
          php -l backend/test/test_backend_global_android_ecosystem.php
          php -l backend/test/test_frontend_global_android_ecosystem.php

      - name: Run Backend and Frontend Android PHP Tests
        run: |
          php backend/test/test_backend_global_android_ecosystem.php
          php backend/test/test_frontend_global_android_ecosystem.php

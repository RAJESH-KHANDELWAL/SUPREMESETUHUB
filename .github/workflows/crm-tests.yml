name: CRM Quality and Dashboard Tests

on:
  push:
    branches:
      - main
      - feat/crm-contact-quality-daily-workflow
      - chore/crm-focused-ci
    paths:
      - "backend/crm/**"
      - "backend/api/crm.py"
      - "backend/api/app.py"
      - "backend/tests/test_crm_*.py"
      - "backend/tests/test_crm_dashboard_routes.py"
      - "frontend/supreme/supreme-ecosystem/supreme-dashboard/**"
      - ".github/workflows/crm-tests.yml"
  pull_request:
    paths:
      - "backend/crm/**"
      - "backend/api/crm.py"
      - "backend/api/app.py"
      - "backend/tests/test_crm_*.py"
      - "backend/tests/test_crm_dashboard_routes.py"
      - "frontend/supreme/supreme-ecosystem/supreme-dashboard/**"
      - ".github/workflows/crm-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Compile CRM and API modules
        run: python -m compileall backend/crm backend/api/crm.py backend/api/app.py
      - name: Run CRM service, API, and dashboard route tests
        run: >-
          python -m pytest -q
          backend/tests/test_crm_service.py
          backend/tests/test_crm_api.py
          backend/tests/test_crm_dashboard_routes.py

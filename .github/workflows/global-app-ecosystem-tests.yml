name: Global APP Ecosystem Tests
on:
 push:
  branches: [main]
  paths:
   - "backend/global_ecosystem/global_app_ecosystem/**"
   - "backend/app/global_ecosystem/global_app_ecosystem/**"
   - "backend/engine/app/**"
   - ".github/workflows/global-app-ecosystem-tests.yml"
 pull_request:
  paths:
   - "backend/global_ecosystem/global_app_ecosystem/**"
   - "backend/app/global_ecosystem/global_app_ecosystem/**"
   - "backend/engine/app/**"
   - ".github/workflows/global-app-ecosystem-tests.yml"
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with:
      python-version: "3.11"
   - name: Compile APP ecosystem
     run: python -m compileall -q backend/global_ecosystem/global_app_ecosystem backend/app/global_ecosystem/global_app_ecosystem backend/engine/app
   - name: Run APP ecosystem tests
     env:
      PYTHONPATH: .
     run: |
      python -m unittest \
       backend.global_ecosystem.global_app_ecosystem.test_catalog \
       backend.app.global_ecosystem.global_app_ecosystem.test_app \
       backend.engine.app.test_app_engine

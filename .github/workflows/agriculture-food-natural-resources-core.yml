name: Agriculture Food Natural Resources Human Animal CORE Tests

on:
  push:
    branches:
      - main
      - feature/agriculture-food-natural-resources-human-animal-core
      - migration/workflows-to-workflow
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/agriculture-food-natural-resources-core.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/agriculture-food-natural-resources-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test and YAML tools
        run: python -m pip install "pytest>=8,<9" PyYAML

      - name: Validate CORE Python syntax
        run: |
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem

      - name: Validate both CORE YAML manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem.yml"),
              Path("backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem.yml"),
          ]
          for file in files:
              with file.open(encoding="utf-8") as stream:
                  data = yaml.safe_load(stream)
              if not isinstance(data, dict) or not data:
                  raise SystemExit(f"Invalid or empty YAML manifest: {file}")
              print(f"YAML OK: {file}")
          PY

      - name: Run Global Agriculture CORE tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/tests -q

      - name: Run Bada Business Agriculture CORE tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem/tests -q

      - name: Run both CORE Python contract tests
        run: |
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/test_global_agriculture_food_natural_resources_human_animal_core_ecosystem.py -q
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem/test_global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem.py -q

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint and run both CORE PHP contract tests
        run: |
          set -euo pipefail
          first="backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem"
          second="backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem"
          php -l "$first/manager.php"
          php -l "$first/test_global_agriculture_food_natural_resources_human_animal_core_ecosystem.php"
          php "$first/test_global_agriculture_food_natural_resources_human_animal_core_ecosystem.php"
          php -l "$second/manager.php"
          php -l "$second/test_global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem.php"
          php "$second/test_global_agriculture_food_natural_resources_human_animal_service_work_business_core_ecosystem.php"

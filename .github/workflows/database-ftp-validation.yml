name: Database and FTP Infrastructure Validation

on:
  pull_request:
    paths:
      - "backend/database/**"
      - "backend/infrastructure/ftp/**"
      - ".github/workflows/database-ftp-validation.yml"
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "backend/infrastructure/ftp/**"
      - ".github/workflows/database-ftp-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check PyMySQL pytest
      - name: Compile database and FTP managers
        run: |
          python -m compileall -q \
            backend/database/control_plane.py \
            backend/database/backup_manager.py \
            backend/database/restore_manager.py \
            backend/database/migration_manager.py \
            backend/infrastructure/ftp
      - name: Run offline infrastructure tests
        run: python -m pytest -q backend/tests/test_database_ftp_managers.py

name: GLOBAL AFFILIATE MARKETING CORE TESTS

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_affiliate_marketing_business_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - "backend/test/test_global_affiliate_marketing_core.py"
      - ".github/workflows/global-affiliate-marketing-core-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affiliate-marketing-core:
    name: Affiliate Marketing CORE contracts, hierarchy and master catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Affiliate Marketing CORE tests
        env:
          PYTHONPATH: .
        run: python -m unittest backend.test.test_global_affiliate_marketing_core -v

      - name: Validate PHP facade syntax
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_affiliate_marketing_business_core_ecosystem/manager.php

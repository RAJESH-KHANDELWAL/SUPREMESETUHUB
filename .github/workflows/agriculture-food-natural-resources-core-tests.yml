name: Agriculture Food Natural Resources Human Animal CORE Tests

on:
  push:
    branches:
      - main
      - feature/agriculture-food-natural-resources-human-animal-core
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/agriculture-food-natural-resources-core-tests.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/agriculture-food-natural-resources-core-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem
      - name: Run Global Agriculture CORE tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/tests -q
      - name: Run Bada Business Agriculture CORE tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/tests -q
      - name: Check PHP interoperability facades
        run: |
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/manager.php
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_bada_business_core_ecosystem/global_agriculture_food_natural_resources_human_animal_core_ecosystem/manager.php

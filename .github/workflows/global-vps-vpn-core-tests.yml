name: GLOBAL VPS AND VPN CORE ECOSYSTEM TESTS

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_vps_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_vpn_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-vps-vpn-core-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_vps_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_vpn_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-vps-vpn-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vps-vpn-core:
    name: VPS and VPN Core contracts, catalogues and package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest>=8.0,<9.0"
      - name: Validate master catalogue JSON
        run: python -c "import json; json.load(open('backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json', encoding='utf-8'))"
      - name: Compile VPS and VPN Core modules
        run: |
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_vps_core_ecosystem
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_vpn_core_ecosystem
          python -m py_compile backend/core/global_ecosystem/global_core_ecosystem/manager.py
      - name: Run VPS Core tests
        env:
          PYTHONPATH: .
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_vps_core_ecosystem/test_vps_core.py -q
      - name: Run VPN Core tests
        env:
          PYTHONPATH: .
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_vpn_core_ecosystem/test_vpn_core.py -q
      - name: Check PHP metadata facades
        run: |
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_vps_core_ecosystem/manager.php
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_vpn_core_ecosystem/manager.php

name: Global Entity Relationships CORE Tests

on:
  push:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_entity_relationships_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-entity-relationships-core-tests.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_entity_relationships_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-entity-relationships-core-tests.yml"
  workflow_dispatch:

jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Python CORE tests
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_entity_relationships_core_ecosystem.test_global_entity_relationships_core -v
      - name: PHP syntax check
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/global_entity_relationships_core_ecosystem/manager.php

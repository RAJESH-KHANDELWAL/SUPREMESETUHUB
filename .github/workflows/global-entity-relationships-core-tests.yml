name: Global Entity Relationships CORE Tests
on:
  push:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_entity_relationships_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-entity-relationships-core-tests.yml"
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_entity_relationships_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-entity-relationships-core-tests.yml"
  workflow_dispatch:
jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Parent CORE tests
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_entity_relationships_core_ecosystem.test_global_entity_relationships_core -v
      - name: All child submodule tests
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_entity_relationships_core_ecosystem.tests.test_submodule_managers -v
      - name: PHP syntax check for child manager facades
        run: find backend/core/global_ecosystem/global_core_ecosystem/global_entity_relationships_core_ecosystem -name manager.php -print0 | xargs -0 -n1 php -l

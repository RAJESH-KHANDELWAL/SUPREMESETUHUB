name: GLOBAL HUMAN LANGUAGE CORE TESTS

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_human_language_core_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-human-language-core-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-language-core:
    name: Human Language Core contracts and master-catalog mapping
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Human Language Core tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_human_language_core_ecosystem.tests.test_human_language_core -v

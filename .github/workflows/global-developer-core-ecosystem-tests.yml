name: Global Developer Core Ecosystem Tests
on:
  push:
    paths:
      - ".github/workflows/global-developer-core-ecosystem-tests.yml"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
  pull_request:
    paths:
      - ".github/workflows/global-developer-core-ecosystem-tests.yml"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
permissions:
  contents: read
jobs:
  developer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Developer Core
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem
      - name: Run Developer Core tests
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_developer_core_ecosystem.test_developer_core
      - name: Validate PHP facade
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/manager.php

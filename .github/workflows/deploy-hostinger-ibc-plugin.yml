name: Deploy DR RAJESH KHANDELWAL IBC Plugin to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/**"
      - ".github/workflows/deploy-hostinger-ibc-plugin.yml"

permissions:
  contents: read

concurrency:
  group: hostinger-ibc-plugin-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate IBC WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check plugin entry point and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc"
          test -f "$SOURCE_DIR/dr-rajesh-khandelwal-ibc.php"
          find "$SOURCE_DIR" -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  deploy-drrajeshkhandelwalibc:
    name: Deploy to drrajeshkhandelwalibc.com
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check deployment settings
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_DRRAJESHKANDELWALIBC_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_DRRAJESHKANDELWALIBC_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_DRRAJESHKANDELWALIBC_FTP_PASSWORD }}
          PLUGIN_DIR: ${{ vars.HOSTINGER_DRRAJESHKANDELWALIBC_PLUGIN_DIR }}
        run: |
          set -eu
          missing=""
          [ -n "$FTP_SERVER" ] || missing="$missing HOSTINGER_DRRAJESHKANDELWALIBC_FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing HOSTINGER_DRRAJESHKANDELWALIBC_FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing HOSTINGER_DRRAJESHKANDELWALIBC_FTP_PASSWORD"
          [ -n "$PLUGIN_DIR" ] || missing="$missing HOSTINGER_DRRAJESHKANDELWALIBC_PLUGIN_DIR"
          if [ -n "$missing" ]; then
            echo "::error::Missing production settings:$missing"
            exit 1
          fi
          case "$PLUGIN_DIR" in
            */wp-content/plugins/dr-rajesh-khandelwal-ibc/) ;;
            *) echo "::error::Plugin directory must end with /wp-content/plugins/dr-rajesh-khandelwal-ibc/"; exit 1 ;;
          esac
      - name: Deploy plugin via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_DRRAJESHKANDELWALIBC_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_DRRAJESHKANDELWALIBC_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_DRRAJESHKANDELWALIBC_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/
          server-dir: ${{ vars.HOSTINGER_DRRAJESHKANDELWALIBC_PLUGIN_DIR }}
          dangerous-clean-slate: false
          log-level: standard

  deploy-rajeshkhandelwalofficial:
    name: Deploy to rajeshkhandelwalofficial.com
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check deployment settings
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_PASSWORD }}
          PLUGIN_DIR: ${{ vars.HOSTINGER_RAJESHKHANDELWALOFFICIAL_PLUGIN_DIR }}
        run: |
          set -eu
          missing=""
          [ -n "$FTP_SERVER" ] || missing="$missing HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_PASSWORD"
          [ -n "$PLUGIN_DIR" ] || missing="$missing HOSTINGER_RAJESHKHANDELWALOFFICIAL_PLUGIN_DIR"
          if [ -n "$missing" ]; then
            echo "::error::Missing production settings:$missing"
            exit 1
          fi
          case "$PLUGIN_DIR" in
            */wp-content/plugins/dr-rajesh-khandelwal-ibc/) ;;
            *) echo "::error::Plugin directory must end with /wp-content/plugins/dr-rajesh-khandelwal-ibc/"; exit 1 ;;
          esac
      - name: Deploy plugin via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_RAJESHKHANDELWALOFFICIAL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/
          server-dir: ${{ vars.HOSTINGER_RAJESHKHANDELWALOFFICIAL_PLUGIN_DIR }}
          dangerous-clean-slate: false
          log-level: standard

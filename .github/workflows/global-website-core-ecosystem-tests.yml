name: GLOBAL WEBSITE CORE ECOSYSTEM TESTS

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_website_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/global-website-core-ecosystem-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_website_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - ".github/workflows/global-website-core-ecosystem-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-core:
    name: Website Core metadata, hierarchy and PHP contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0,<9.0"

      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_website_core_ecosystem
          python -m py_compile backend/core/global_ecosystem/global_core_ecosystem/manager.py

      - name: Run Website Core tests
        env:
          PYTHONPATH: .
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_website_core_ecosystem/test_global_website_core.py -q

      - name: Check PHP facade syntax
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/global_website_core_ecosystem/manager.php

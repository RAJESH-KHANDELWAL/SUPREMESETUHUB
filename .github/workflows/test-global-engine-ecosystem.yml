name: GLOBAL ENGINE Ecosystem Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/engine/global_ecosystem/**"
      - "backend/tests/test_global_engine_ecosystem_independence.py"
      - "backend/tests/test_global_engine_provider_hierarchy.py"
      - ".github/workflows/test-global-engine-ecosystem.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/engine/global_ecosystem/**"
      - "backend/tests/test_global_engine_ecosystem_independence.py"
      - ".github/workflows/test-global-engine-ecosystem.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-global-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run independent ENGINE ecosystem tests
        run: python -m pytest backend/tests/test_global_engine_ecosystem_independence.py backend/tests/test_global_engine_provider_hierarchy.py -q

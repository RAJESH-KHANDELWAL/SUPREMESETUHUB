name: Backend WordPress Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/wordpress/**"
      - "backend/test/test_wordpress_connection.py"
      - "backend/test/test_backend_wordpress.py"
      - ".github/workflows/backend-wordpress.yml"
  push:
    branches: [main]
    paths:
      - "backend/wordpress/**"
      - "backend/test/test_wordpress_connection.py"
      - "backend/test/test_backend_wordpress.py"
      - ".github/workflows/backend-wordpress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-wordpress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt "pytest>=8,<9"

      - name: Compile backend WordPress Python files
        run: python -m compileall -q backend/wordpress

      - name: Run backend WordPress tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            backend/test/test_wordpress_connection.py \
            backend/test/test_backend_wordpress.py

      - name: Lint backend WordPress PHP files when present
        shell: bash
        run: |
          mapfile -d '' php_files < <(find backend/wordpress -type f -name '*.php' -print0)
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No PHP files in backend/wordpress; PHP lint not applicable."
            exit 0
          fi
          for file in "${php_files[@]}"; do php -l "$file"; done

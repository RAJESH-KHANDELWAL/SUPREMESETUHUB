name: Identity Gate Architecture Validation

on:
  pull_request:
    paths:
      - "backend/database/identity_*.py"
      - "backend/database/gde_connection.py"
      - "backend/database/migrations/mysql/**"
      - "backend/php/**"
      - "backend/tests/test_identity_gate.py"
      - "backend/tests/test_ftp_profiles.py"
      - "backend/infrastructure/ftp/profiles.py"
      - "backend/database/IDENTITY-ARCHITECTURE.md"
      - ".github/workflows/identity-gate-validation.yml"
  push:
    branches: [main]
    paths:
      - "backend/database/identity_*.py"
      - "backend/database/gde_connection.py"
      - "backend/database/migrations/mysql/**"
      - "backend/php/**"
      - "backend/tests/test_identity_gate.py"
      - "backend/database/IDENTITY-ARCHITECTURE.md"
      - ".github/workflows/identity-gate-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyMySQL pytest
      - name: Compile Python identity modules
        run: python -m compileall -q backend/database/gde_connection.py backend/database/identity_gate.py backend/database/identity_context.py backend/infrastructure/ftp/profiles.py backend/tests/test_identity_gate.py backend/tests/test_ftp_profiles.py
      - name: Run identity gate tests
        run: python -m pytest -q backend/tests/test_identity_gate.py backend/tests/test_ftp_profiles.py
      - name: Validate PHP syntax when PHP CLI is available
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l backend/php/IdentityGate.php
          else
            echo "PHP CLI not installed on runner; PHP syntax check skipped."
          fi

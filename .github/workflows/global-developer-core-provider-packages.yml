name: Global Developer Core Provider Package Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/**"
      - "backend/test/test_global_developer_core_packages.py"
      - ".github/workflows/global-developer-core-provider-packages.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/**"
      - "backend/test/test_global_developer_core_packages.py"
      - ".github/workflows/global-developer-core-provider-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-package-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate provider package structure
        env:
          PYTHONPATH: .
        run: python -m unittest backend.test.test_global_developer_core_packages -v

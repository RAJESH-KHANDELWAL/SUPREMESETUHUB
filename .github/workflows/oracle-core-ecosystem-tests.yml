name: Oracle Core Ecosystem Tests

on:
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/oracle_core_ecosystem/**"
      - ".github/workflows/oracle-core-ecosystem-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/oracle_core_ecosystem/**"
      - ".github/workflows/oracle-core-ecosystem-tests.yml"

jobs:
  oracle-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Python syntax
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/oracle_core_ecosystem
      - name: Oracle Core tests
        env:
          PYTHONPATH: backend/core/global_ecosystem/global_core_ecosystem
        run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/oracle_core_ecosystem/tests
      - name: PHP syntax
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/oracle_core_ecosystem/manager.php

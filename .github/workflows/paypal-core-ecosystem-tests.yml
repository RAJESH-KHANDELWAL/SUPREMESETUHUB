name: PayPal Core Ecosystem Tests
on:
  push:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/paypal_core_ecosystem/**'
      - '.github/workflows/paypal-core-ecosystem-tests.yml'
  pull_request:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/paypal_core_ecosystem/**'
      - '.github/workflows/paypal-core-ecosystem-tests.yml'
  workflow_dispatch:
jobs:
  paypal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PayPal Core
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/paypal_core_ecosystem
      - name: Run PayPal Core tests
        run: python -m unittest discover -s backend/core/global_ecosystem/global_core_ecosystem/paypal_core_ecosystem/tests -v
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP facade and contract
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/paypal_core_ecosystem/manager.php && php -l backend/core/global_ecosystem/global_core_ecosystem/paypal_core_ecosystem/paypal_php_core_ecosystem/PayPalCoreContract.php

name: Global Storage Core Ecosystem Tests
on:
  push:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/**'
      - 'backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json'
      - '.github/workflows/global-storage-core-ecosystem-tests.yml'
  pull_request:
    paths:
      - 'backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/**'
      - 'backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json'
      - '.github/workflows/global-storage-core-ecosystem-tests.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile Python
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem
      - name: Validate catalog inventory
        run: python -m backend.core.global_ecosystem.global_core_ecosystem.global_storage_core_ecosystem.tools.validate_storage_catalog
      - name: Run storage Core tests
        run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/test_storage_core_domains.py
      - name: Validate JSON
        run: python -m json.tool backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json > /dev/null && python -m json.tool backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/ecosystem_manifest.json > /dev/null && python -m json.tool backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/product_ecosystem_index.json > /dev/null
      - name: PHP syntax
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/manager.php

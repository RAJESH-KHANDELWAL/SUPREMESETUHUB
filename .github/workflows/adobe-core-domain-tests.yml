name: ADOBE CORE DOMAIN TESTS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adobe-core-domains:
    name: Adobe Core domain managers and inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt "pytest>=8.0,<9.0"

      - name: Test Adobe Core manager, catalog and domains
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/adobe_core_ecosystem/test_adobe_core_domains.py -q

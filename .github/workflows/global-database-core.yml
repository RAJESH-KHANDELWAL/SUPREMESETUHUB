name: Global Database Core Ecosystem Tests
on:
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_database_core_ecosystem/**"
      - "backend/test/test_database_core_ecosystem.py"
      - ".github/workflows/database-core-ecosystem-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_database_core_ecosystem/**"
      - "backend/test/test_database_core_ecosystem.py"
      - ".github/workflows/database-core-ecosystem-tests.yml"
jobs:
  database-core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Database Core contract tests
        run: python -m unittest backend.test.test_database_core_ecosystem -v

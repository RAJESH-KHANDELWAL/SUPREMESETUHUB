name: Package WordPress Plugins

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "wordpress-plugin/**"
      - "backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/**"
      - "backend/wordpress/wp-content/plugins/supremesetuhub/**"
      - ".github/workflows/package-wordpress-plugin.yml"
  push:
    branches:
      - main
    paths:
      - "wordpress-plugin/**"
      - "backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/**"
      - "backend/wordpress/wp-content/plugins/supremesetuhub/**"
      - ".github/workflows/package-wordpress-plugin.yml"

permissions:
  contents: read

jobs:
  package:
    name: Validate and package WordPress plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate plugin files and PHP syntax
        run: |
          set -e
          for plugin in supremesetuhub-connector supreme-ecosystem-home supreme-print-on-demand; do
            php_file=$(find "wordpress-plugin/$plugin" -maxdepth 1 -name '*.php' -print -quit)
            test -n "$php_file"
            php -l "$php_file"
          done
          php -l backend/wordpress/wp-content/plugins/supremesetuhub/supremesetuhub.php
          php -l backend/wordpress/wp-content/plugins/supremesetuhub/supremesetuhub_wordpress_connector.php
          php -l backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/dr-rajesh-khandelwal-ibc.php
          php -l backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/supreme/dr-rajesh-khandelwal-ibc.php
          php -l backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/supreme/supreme.php
          php -l backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/supreme/supreme_dashboard/supreme_dashboard.php
          php -l backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/supreme/supreme_ecosystem/supreme_ecosystem.php
          php -l backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc/supreme/supreme_ecosystem/supreme_dashboard_ecosystem/supreme_dashboard_ecosystem.php

      - name: Build installable plugin ZIPs
        run: |
          set -e
          mkdir -p dist/package-root
          cp -R backend/wordpress/wp-content/plugins/supremesetuhub dist/package-root/
          cp -R backend/wordpress/wp-content/plugins/dr-rajesh-khandelwal-ibc dist/package-root/
          (cd dist/package-root && zip -r ../supremesetuhub.zip supremesetuhub)
          (cd dist/package-root && zip -r ../dr-rajesh-khandelwal-ibc.zip dr-rajesh-khandelwal-ibc)
          for archive in dist/supremesetuhub.zip dist/dr-rajesh-khandelwal-ibc.zip; do
            unzip -t "$archive"
          done
          unzip -Z1 dist/supremesetuhub.zip | grep -q "^supremesetuhub/supremesetuhub.php$"
          unzip -Z1 dist/dr-rajesh-khandelwal-ibc.zip | grep -q "^dr-rajesh-khandelwal-ibc/dr-rajesh-khandelwal-ibc.php$"
          for plugin in supremesetuhub-connector supreme-ecosystem-home supreme-print-on-demand; do
            (cd wordpress-plugin && zip -r "../dist/$plugin.zip" "$plugin")
            unzip -t "dist/$plugin.zip"
          done

      - name: Upload WordPress plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: supremesetuhub-wordpress-plugins
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

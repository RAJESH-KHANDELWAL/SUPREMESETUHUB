name: Package SUPREMESETUHUB WordPress Plugin

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "wordpress-plugin/supremesetuhub-connector/**"
      - ".github/workflows/package-wordpress-plugin.yml"
  push:
    branches: [main]
    paths:
      - "wordpress-plugin/supremesetuhub-connector/**"
      - ".github/workflows/package-wordpress-plugin.yml"

permissions:
  contents: read

jobs:
  package:
    name: Validate and package the single SUPREMESETUHUB plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate unified plugin files and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_DIR="wordpress-plugin/supremesetuhub-connector"
          test -f "$PLUGIN_DIR/supremesetuhub-connector.php"
          test -f "$PLUGIN_DIR/readme.md"
          find "$PLUGIN_DIR" -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Build the single installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd wordpress-plugin && zip -r ../dist/supremesetuhub.zip supremesetuhub-connector)
          unzip -t dist/supremesetuhub.zip
          unzip -Z1 dist/supremesetuhub.zip | grep -q "^supremesetuhub-connector/supremesetuhub-connector.php$"

      - name: Upload unified plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: supremesetuhub-wordpress-plugin
          path: dist/supremesetuhub.zip
          if-no-files-found: error
          retention-days: 30

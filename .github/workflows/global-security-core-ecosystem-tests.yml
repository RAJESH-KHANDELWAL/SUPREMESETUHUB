name: GLOBAL SECURITY CORE ECOSYSTEM TESTS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-security-core:
    name: Test Global Security CORE ecosystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install "pytest>=8.0,<9.0"

      - name: Run Global Security CORE ecosystem tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/global_security_core_ecosystem/tests -q
          python -m pytest backend/test/test_global_security_core_ecosystem.py -q

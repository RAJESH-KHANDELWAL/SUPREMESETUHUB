name: Global Foundation Ecosystem Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/foundation/**"
      - "frontend/foundation/**"
      - "backend/infrastructure/global_ecosystem/**"
      - "frontend/infrastructure/global_ecosystem/**"
      - "backend/test/test_backend_global_foundation_ecosystem.py"
      - "backend/test/test_frontend_global_foundation_ecosystem.py"
      - ".github/workflows/global-foundation-ecosystem-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/foundation/**"
      - "frontend/foundation/**"
      - "backend/infrastructure/global_ecosystem/**"
      - "frontend/infrastructure/global_ecosystem/**"
      - "backend/test/test_backend_global_foundation_ecosystem.py"
      - "backend/test/test_frontend_global_foundation_ecosystem.py"
      - ".github/workflows/global-foundation-ecosystem-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-foundation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - name: Compile targeted Python files
        run: |
          python -m compileall -q \
            backend/foundation \
            frontend/foundation \
            backend/infrastructure/global_ecosystem \
            frontend/infrastructure/global_ecosystem \
            backend/test/test_backend_global_foundation_ecosystem.py \
            backend/test/test_frontend_global_foundation_ecosystem.py
      - name: Run focused Foundation and Infrastructure tests
        run: python -m unittest discover -s backend/test -p "test_*global_foundation_ecosystem.py" -v
      - name: Check backend PHP syntax
        run: |
          php -l backend/infrastructure/backend_infrastructure_frontend_foundation_connect.php
          php -l backend/infrastructure/global_ecosystem/global_infrastructure_ecosystem/backend_global_infrastructure_ecosystem_frontend_global_foundation_ecosystem_connect.php
          php -l backend/foundation/manager.php
          php -l backend/foundation/backend_foundation_frontend_infrastructure_connect.php
          php -l backend/foundation/global_ecosystem/manager.php
          php -l backend/foundation/global_ecosystem/global_foundation_ecosystem/manager.php
          php -l backend/foundation/global_ecosystem/global_foundation_ecosystem/backend_global_foundation_ecosystem_frontend_global_foundation_ecosystem_connect.php
          php -l backend/foundation/global_ecosystem/global_foundation_ecosystem/backend_global_foundation_ecosystem_frontend_global_infrastructure_ecosystem_connect.php
      - name: Check frontend PHP syntax
        run: |
          php -l frontend/infrastructure/frontend_infrastructure_backend_foundation_connect.php
          php -l frontend/infrastructure/global_ecosystem/global_infrastructure_ecosystem/frontend_global_infrastructure_ecosystem_backend_global_foundation_ecosystem_connect.php
          php -l frontend/foundation/manager.php
          php -l frontend/foundation/frontend_foundation_backend_infrastructure_connect.php
          php -l frontend/foundation/global_ecosystem/manager.php
          php -l frontend/foundation/global_ecosystem/global_foundation_ecosystem/manager.php
          php -l frontend/foundation/global_ecosystem/global_foundation_ecosystem/frontend_global_foundation_ecosystem_backend_global_foundation_ecosystem_connect.php
          php -l frontend/foundation/global_ecosystem/global_foundation_ecosystem/frontend_global_foundation_ecosystem_backend_global_infrastructure_ecosystem_connect.php

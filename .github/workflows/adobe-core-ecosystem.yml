name: ADOBE CORE ECOSYSTEM TESTS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adobe-core-ecosystem:
    name: Adobe Core Python and PHP tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt "pytest>=8.0,<9.0"

      - name: Run Adobe Core Python tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/core/global_ecosystem/global_core_ecosystem/adobe_core_ecosystem/test_adobe_core_ecosystem.py -q

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP syntax
        run: |
          php -l backend/core/global_ecosystem/global_core_ecosystem/adobe_core_ecosystem/manager.php
          php -l backend/core/global_ecosystem/global_core_ecosystem/adobe_core_ecosystem/php/AdobeCoreContract.php
          php -l backend/core/global_ecosystem/global_core_ecosystem/adobe_core_ecosystem/test_adobe_core_ecosystem.php

      - name: Run Adobe Core PHP tests
        run: |
          php backend/core/global_ecosystem/global_core_ecosystem/adobe_core_ecosystem/test_adobe_core_ecosystem.php

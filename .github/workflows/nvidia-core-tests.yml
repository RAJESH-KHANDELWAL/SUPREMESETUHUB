name: NVIDIA Core Ecosystem Tests
on:
 pull_request:
  paths: ['backend/core/global_ecosystem/global_core_ecosystem/nvidia_core_ecosystem/**','.github/workflows/nvidia-core-tests.yml']
 push:
  branches: [main]
  paths: ['backend/core/global_ecosystem/global_core_ecosystem/nvidia_core_ecosystem/**','.github/workflows/nvidia-core-tests.yml']
permissions: {contents: read}
jobs:
 nvidia-core:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python -m pip install pytest
   - run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/nvidia_core_ecosystem/tests -q
   - run: php -l backend/core/global_ecosystem/global_core_ecosystem/nvidia_core_ecosystem/manager.php

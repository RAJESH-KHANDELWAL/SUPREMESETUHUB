name: Stripe Core Ecosystem Tests
on:
  push:
    branches: [main]
    paths: ['backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/**','backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json','.github/workflows/stripe-core-ecosystem-tests.yml']
  pull_request:
    branches: [main]
    paths: ['backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/**','backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json','.github/workflows/stripe-core-ecosystem-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stripe-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile Stripe Core
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem
      - name: Run Stripe Core tests
        env: {PYTHONPATH: .}
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.stripe_core_ecosystem.tests.test_stripe_core -v
      - name: Validate package inventory
        run: python backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/tools/validate_stripe_catalog.py
      - name: Lint PHP facade
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/manager.php && php -l backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/stripe_php_core_ecosystem/StripeCoreContract.php

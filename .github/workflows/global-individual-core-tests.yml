name: GLOBAL INDIVIDUAL CORE TESTS

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_individual_core_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-individual-core-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  individual-core:
    name: Individual Core contracts and master catalogue mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Individual Core tests
        env:
          PYTHONPATH: .
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_individual_core_ecosystem.tests.test_individual_core -v

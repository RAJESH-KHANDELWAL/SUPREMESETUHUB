name: Global Cloud CORE Ecosystem Tests
on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem/**"
      - "backend/global_ecosystem/global_cloud_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-cloud-core-ecosystem-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem/**"
      - "backend/global_ecosystem/global_cloud_ecosystem/**"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/global-cloud-core-ecosystem-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-cloud-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Compile Global Cloud CORE
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem
      - name: Validate canonical cloud registries, domains and master catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.global_ecosystem.global_cloud_ecosystem import list_cloud_providers, list_cloud_workloads, validate_cloud_catalog, validate_cloud_workloads
          from backend.core.global_ecosystem.global_core_ecosystem.global_cloud_core_ecosystem import get_manager, CLOUD_DOMAIN_DEFINITIONS
          manager=get_manager()
          providers=list_cloud_providers()
          workloads=list_cloud_workloads()
          assert providers and workloads
          assert validate_cloud_catalog()==(), validate_cloud_catalog()
          assert validate_cloud_workloads()==(), validate_cloud_workloads()
          assert manager.status()["provider_count"]==len(providers)
          assert manager.status()["workload_count"]==len(workloads)
          assert len(CLOUD_DOMAIN_DEFINITIONS)==10
          assert len(manager.list_domain_inventory())==len(providers)
          assert sum(x["provider_count"] for x in manager.list_domains()["domains"])==len(providers)
          master=json.loads(Path("backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json").read_text(encoding="utf-8"))
          counts, expansion=master["counts"], master["expansion"]
          assert master["catalogue_id"]=="GLOBAL_TO_SUPREME_MASTER_ECOSYSTEM"
          assert expansion["target_unique_entries"]==2468
          assert expansion["current_unique_entries"]==counts["unique_catalogue_entries"]
          assert expansion["remaining_unique_entries"]==2468-expansion["current_unique_entries"]
          inventory=manager.master_catalog_inventory()
          assert inventory["source_numbered_entries"]==counts["source_numbered_entries"]
          assert inventory["current_unique_entries"]==counts["unique_catalogue_entries"]
          assert inventory["cross_reference_entries"]==counts["cross_reference_entries"]
          assert len(inventory["entries"])==counts["source_numbered_entries"]
          assert len(inventory["sections"])==counts["section_count"]
          assert manager.master_catalog_reference()["owner_layer"]=="GLOBAL_ENGINE_ECOSYSTEM"
          PY
      - name: Validate PHP master catalog parity
        run: |
          php -l backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem/manager.php
          php -r 'require "backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem/manager.php"; $catalog=GlobalCloudCoreManager::masterCatalogInventory(); if ($catalog["target_unique_entries"] !== 2468 || count($catalog["entries"]) !== $catalog["source_numbered_entries"]) { fwrite(STDERR, "PHP_MASTER_CATALOG_CONTRACT_FAILED\n"); exit(1); }'
      - name: Run Global Cloud CORE tests
        run: python -m unittest discover -s backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem -t backend/core/global_ecosystem/global_core_ecosystem -p "test*.py" -v

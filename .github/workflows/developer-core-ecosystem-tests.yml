name: Global Developer Core Ecosystem Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/**"
      - "backend/api/global_ecosystem/global_api_ecosystem/global_developer_api_ecosystem/**"
      - "backend/global_ecosystem/global_developer_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/catalog.py"
      - ".github/workflows/developer-core-ecosystem-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_developer_core_ecosystem/**"
      - "backend/api/global_ecosystem/global_api_ecosystem/global_developer_api_ecosystem/**"
      - "backend/global_ecosystem/global_developer_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/catalog.py"
      - ".github/workflows/developer-core-ecosystem-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Developer Core contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest backend.core.global_ecosystem.global_core_ecosystem.global_developer_core_ecosystem.tests.test_developer_core_ecosystem -v

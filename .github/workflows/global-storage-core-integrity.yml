name: Global Storage CORE Integrity

on:
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/**"
      - ".github/workflows/global-storage-core-integrity.yml"
  push:
    branches: ["**"]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem/**"
      - ".github/workflows/global-storage-core-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-storage-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem
      - name: Validate JSON manifests and provider schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem")
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          expected = {"apple", "aws", "digitalocean", "google", "microsoft"}
          catalog = json.loads((root / "providers_catalog.json").read_text())
          assert {p["provider_id"] for p in catalog["providers"]} == expected
          assert all(p["status"] == "CATALOG_ONLY" and not p["live_connection_verified"] for p in catalog["providers"])
          print("Storage CORE JSON contracts are valid.")
          PY
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Global Storage CORE tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem
      - name: Validate PHP caller-context contracts
        run: |
          find backend/core/global_ecosystem/global_core_ecosystem/global_storage_core_ecosystem -name contract.php -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

name: PHP and GLOBAL PHP ECOSYSTEM Tests

on:
  push:
    branches:
      - main
    paths:
      - "backend/php/**"
      - ".github/workflows/test-global-php-ecosystem.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/php/**"
      - ".github/workflows/test-global-php-ecosystem.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l backend/php/IdentityGate.php
          php -l backend/php/test_php.php
          php -l backend/php/global_ecosystem/global_php_ecosystem/GlobalAlgorithmKernel.php
          php -l backend/php/global_ecosystem/global_php_ecosystem/bootstrap.php
          php -l backend/php/global_ecosystem/global_php_ecosystem/test_global_php_ecosystem.php

      - name: Run PHP foundation tests
        run: php backend/php/test_php.php

      - name: Run GLOBAL PHP ECOSYSTEM tests
        run: php backend/php/global_ecosystem/global_php_ecosystem/test_global_php_ecosystem.php

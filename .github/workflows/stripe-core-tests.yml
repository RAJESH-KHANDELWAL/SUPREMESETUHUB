name: STRIPE CORE ECOSYSTEM TESTS

on:
  pull_request:
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/**"
      - ".github/workflows/stripe-core-tests.yml"
  push:
    branches: ['**']
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/**"
      - ".github/workflows/stripe-core-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    name: Stripe Core Python tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Parse Stripe Core Python files
        run: python -m compileall -q backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem
      - name: Run Stripe Core tests
        run: python -m pytest backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/tests -q

  php-syntax:
    name: Stripe Core PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - name: Lint Stripe Core PHP facade
        run: php -l backend/core/global_ecosystem/global_core_ecosystem/stripe_core_ecosystem/manager.php

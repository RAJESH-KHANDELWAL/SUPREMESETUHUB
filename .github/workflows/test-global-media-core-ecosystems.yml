name: Global Media Core Ecosystems

on:
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_video_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_photo_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/test-global-media-core-ecosystems.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_video_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/global_photo_core_ecosystem/**"
      - "backend/core/global_ecosystem/global_core_ecosystem/manager.py"
      - "backend/GLOBAL_SUPREME_ECOSYSTEM_CATALOG.json"
      - ".github/workflows/test-global-media-core-ecosystems.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-media-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run Video and Photo Core tests
        run: >-
          python -m pytest
          backend/core/global_ecosystem/global_core_ecosystem/global_video_core_ecosystem/test_video_core.py
          backend/core/global_ecosystem/global_core_ecosystem/global_photo_core_ecosystem/test_photo_core.py
          -q

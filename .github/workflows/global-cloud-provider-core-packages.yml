name: Global Cloud Provider Core Package Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem/**"
      - "backend/test/test_global_cloud_provider_packages.py"
      - ".github/workflows/global-cloud-provider-core-packages.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/global_ecosystem/global_core_ecosystem/global_cloud_core_ecosystem/**"
      - "backend/test/test_global_cloud_provider_packages.py"
      - ".github/workflows/global-cloud-provider-core-packages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate canonical provider package scaffolds
        env:
          PYTHONPATH: .
        run: python -m unittest backend.test.test_global_cloud_provider_packages -v

name: PHP Quality

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/php-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/php-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP 8.3 / 8.5 syntax and core tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Lint tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php')

      - name: Run global algorithm kernel tests
        run: php backend/tests/php/global_algorithm_kernel_test.php

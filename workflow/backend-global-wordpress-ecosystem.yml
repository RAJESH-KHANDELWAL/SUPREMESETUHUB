name: Backend Global WordPress Ecosystem Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/wordpress/global_ecosystem/**"
      - "backend/test/test_backend_global_wordpress_ecosystem.py"
  pull_request:
    branches: [main]
    paths:
      - "backend/wordpress/global_ecosystem/**"
      - "backend/test/test_backend_global_wordpress_ecosystem.py"

permissions:
  contents: read

jobs:
  backend-global-wordpress-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Compile Global WordPress Ecosystem Python files
        run: python -m compileall -q backend/wordpress/global_ecosystem
      - name: Run backend Global WordPress Ecosystem tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/test/test_backend_global_wordpress_ecosystem.py
      - name: Lint Global WordPress Ecosystem PHP files when present
        shell: bash
        run: |
          mapfile -d '' php_files < <(find backend/wordpress/global_ecosystem -type f -name '*.php' -print0)
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No PHP files in backend/wordpress/global_ecosystem; PHP lint not applicable."
            exit 0
          fi
          for file in "${php_files[@]}"; do php -l "$file"; done
